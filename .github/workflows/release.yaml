name: Release ibus-bamboo
run-name: ${{ github.actor }} is triggering on GitHub Actions 🚀
on: [push]
jobs:
  Build-test-freebsd:
    runs-on: ubuntu-latest
    name: Build and Test in FreeBSD
    steps:
      - uses: actions/checkout@master
        with:
          fetch-depth: 1
      - name: Setup VM, download dependencies to build and test in FreeBSD
        id: test
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.0"
          usesh: true
          prepare: |
            pkg install -y go pkgconf libX11 libXtst gtk3
          run: |
            make test && make build

  Build-test-nix-flake:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v27
    - name: Build flake
      run: nix build
    - name: Use flake devShell
      run: nix develop

  Test:
    runs-on: ubuntu-latest
    name: Vet and race-test on Linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev libgtk-3-dev
      - run: test -z "$(gofmt -l *.go config ui)"
      - run: go vet -mod=vendor ./...
      - run: go test -mod=vendor -race ./...

  Releaser:
    # Publishing needs the OBS credentials, which only the upstream repository has.
    if: github.repository == 'BambooEngine/ibus-bamboo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
        with:
          fetch-depth: 1
      - run: sudo apt-get update && sudo apt-get install -y make libibus-1.0-dev libx11-dev libxtst-dev libgtk-3-dev osc
      - run: make test && make build
      - shell: bash
        env:
          OSC_USER: ${{ secrets.OSC_USER }}
          OSC_PASS: ${{ secrets.OSC_PASS }}
          OSC_PATH: ${{ secrets.OSC_PATH }}
          GH_TAG: ${{ github.ref_name }}
        run: |
          chmod +x scripts/osc.bash
          ./scripts/osc.bash
      - run: echo "🍏 This job's status is ${{ job.status }}."
